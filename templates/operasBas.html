{% extends "layout.html" %}

{% block content %}
<div class="container">
    <form action="/resultado" method="post">
        <div class="mb-3">
            <label for="n1" class="form-label">Número 1:</label>
            <input type="number" step="any" class="form-control" name="num1" required>
        </div>
        <div class="mb-3">
            <label for="n2" class="form-label">Número 2:</label>
            <input type="number" step="any" class="form-control" name="num2" required>
        </div>

        <div class="mb-3">
            <label class="form-label d-block">Selecciona una operación:</label>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="operacion" value="suma" checked>
                <label class="form-check-label">Suma</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="operacion" value="resta">
                <label class="form-check-label">Resta</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="operacion" value="multi">
                <label class="form-check-label">Multiplicación</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="operacion" value="divi">
                <label class="form-check-label">División</label>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Calcular</button>
    </form>
</div>
{% endblock %}
